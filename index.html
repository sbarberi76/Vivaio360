<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vivaio360 · Scuola calcio</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#18332b;background:#f4f7f4;font-synthesis:none}*{box-sizing:border-box}body{margin:0;display:flex;min-height:100vh}aside{width:235px;background:#143c30;color:#fff;padding:34px 24px;display:flex;flex-direction:column;position:fixed;height:100vh}.brand{font-size:32px;font-weight:900;text-decoration:none;color:white;letter-spacing:-2px}.brand span{color:#a9ec69}.club{font-weight:700;letter-spacing:2px;font-size:13px;margin:26px 0 40px}.club small{font-weight:400;letter-spacing:0;color:#b5cec3;line-height:2.5}nav{display:grid;gap:9px}button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:12px 17px;background:#216342;color:white;font-weight:600}nav button{text-align:left;background:transparent;color:#c4d8ce;font-size:14px}nav button:hover,nav button.active{background:#2e5143;color:#fff}.season{margin-top:auto;font-size:11px;letter-spacing:1px;line-height:2}.season small{color:#a7bfb2;letter-spacing:0}main{margin-left:235px;padding:28px 45px;width:calc(100% - 235px);max-width:1550px}header{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:1.5px;color:#718179;border-bottom:1px solid #dce5dc;padding-bottom:24px}.badge{letter-spacing:0;color:#2c6848;background:#e6efdf;padding:8px 12px;border-radius:20px}h1{font-size:32px;letter-spacing:-1px;margin:32px 0 8px}h2{font-size:18px;margin-top:0}.sub{color:#75827a;font-size:14px;margin-bottom:28px}.hero{border-radius:16px;background:#ddecce;padding:28px;margin:25px 0;position:relative;overflow:hidden}.hero h2{font-size:25px;max-width:440px;line-height:1.3}.hero p{color:#4d7153;margin-bottom:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stat,.panel{background:white;border:1px solid #e0e7df;border-radius:13px;padding:22px}.stat label{color:#74857a;font-size:13px}.stat strong{display:block;font-size:30px;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:23px}.panel{margin-top:20px}.grid .panel{margin-top:0}form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0}label{font-size:13px;display:grid;gap:7px}input,select{font:inherit;color:#18332b;border:1px solid #d4dfd6;border-radius:8px;background:#fff;padding:11px;width:100%}form button{align-self:end;min-height:43px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}td,th{padding:15px 10px;border-bottom:1px solid #edf0ec}th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#78877c}td small{display:block;color:#829084;margin-top:5px}.empty{padding:24px;color:#829084;text-align:center;font-size:14px}.pill{display:inline-block;font-size:12px;border-radius:20px;padding:5px 10px;background:#eaf3e2;color:#487539}.unpaid{background:#fff1dc;color:#956318}.row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #edf0ec;padding:15px 0}.row span{font-size:14px}.row small{display:block;color:#829084;font-size:12px;margin-top:5px}.actions{display:flex;gap:8px}.actions button{padding:7px 12px;font-size:12px;background:#e8eee6;color:#486347}.actions button.selected{background:#216342;color:white}#notice{position:fixed;bottom:22px;right:25px;max-width:400px;background:#183e30;color:white;border-radius:10px;padding:15px;box-shadow:0 8px 28px #0002}#notice:empty{display:none}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #88c957;outline-offset:2px}@media(max-width:900px){aside{width:190px;padding:25px 15px}main{margin-left:190px;width:calc(100% - 190px);padding:24px}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}form{grid-template-columns:1fr 1fr}}@media(max-width:600px){body{display:block}aside{position:static;width:100%;height:auto;padding:18px}.brand{font-size:25px}.club,.season{display:none}nav{display:flex;overflow-x:auto;margin-top:15px}nav button{white-space:nowrap;padding:9px}main{margin:0;width:100%;padding:20px}.badge{display:none}h1{font-size:27px}form{grid-template-columns:1fr}.stat{padding:17px}.hero{padding:22px}}
</style></head><body><aside><a class="brand" href="./">V<span>360</span></a><p class="club">VIVAIO360<br><small>La tua scuola calcio</small></p><nav aria-label="Navigazione principale"><button data-page="overview" class="active">Panoramica</button><button data-page="athletes">Atleti e genitori</button><button data-page="teams">Squadre</button><button data-page="sessions">Allenamenti</button><button data-page="fees">Quote e pagamenti</button></nav><div class="season">PASSIONE CHE CRESCE<br><small>Ogni talento parte da qui.</small></div></aside><main><header><span>GESTIONE SCUOLA CALCIO</span><button id="reset-demo" type="button">Ripristina demo</button></header><p class="demo-banner"><strong>DEMO · Dati inventati</strong> — Le modifiche restano in questo browser. Non inserire dati personali reali.</p><div id="content"></div><p id="notice" role="status" aria-live="polite"></p></main><script>(() => {
 const key='vivaio360-demo-v1';
 const initial=()=>({
 teams:[{id:1,name:'Pulcini Verde',category:'Pulcini'},{id:2,name:'Esordienti Blu',category:'Esordienti'}],
 athletes:[{id:1,name:'Atleta Demo 1',birth:'2016-04-12',parent:'Genitore Demo 1',phone:'Contatto dimostrativo',team_id:1},{id:2,name:'Atleta Demo 2',birth:'2016-09-18',parent:'Genitore Demo 2',phone:'Contatto dimostrativo',team_id:1},{id:3,name:'Atleta Demo 3',birth:'2014-01-22',parent:'Genitore Demo 3',phone:'Contatto dimostrativo',team_id:2}],
 sessions:[{id:1,team_id:1,date:new Date(Date.now()+86400000).toISOString().slice(0,10),place:'Campo Demo A'},{id:2,team_id:2,date:new Date(Date.now()+172800000).toISOString().slice(0,10),place:'Campo Demo B'}],
 attendance:[],fees:[{id:1,athlete_id:1,description:'Iscrizione demo',amount:15000,due:new Date().toISOString().slice(0,10),paid:0},{id:2,athlete_id:2,description:'Iscrizione demo',amount:15000,due:new Date().toISOString().slice(0,10),paid:1}]});
 let data;
 try{data=JSON.parse(localStorage.getItem(key))||initial();}catch{data=initial();}
 const save=()=>{try{localStorage.setItem(key,JSON.stringify(data));}catch{/* In private browsers the demo can continue in memory. */}};
 window.vivaioDemo={
 get:()=>structuredClone(data),
 reset:()=>{data=initial();save();},
 post:(route,b)=>{
 const tables={teams:'teams',athletes:'athletes',sessions:'sessions',fees:'fees'};
 if(tables[route]){
 const table=data[tables[route]];
 if(route==='fees'&&(!Number.isSafeInteger(b.amount)||b.amount<=0))throw Error('Importo non valido.');
 table.push({...b,id:Math.max(0,...table.map(x=>x.id))+1,...(route==='fees'?{paid:0}:{})});
 }else if(route==='attendance'){
 const entry=data.attendance.find(a=>a.session_id===b.session_id&&a.athlete_id===b.athlete_id);
 if(entry)entry.present=b.present;else data.attendance.push({...b});
 }else if(route==='payments'){
 const fee=data.fees.find(f=>f.id===b.id);if(!fee)throw Error('Quota inesistente.');fee.paid=b.paid;
 }else throw Error('Operazione non disponibile.');
 save();
 }
 };
})();
</script><script>let state, page='overview', selectedSession='';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const euro=c=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(c/100);
const day=d=>d?d.split('-').reverse().join('/'):'';
const team=id=>state.teams.find(t=>t.id===id)?.name||'—';
const athlete=id=>state.athletes.find(a=>a.id===id)?.name||'—';
const options=items=>'<option value="">Seleziona…</option>'+items.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
const field=(name,label,type='text',extra='')=>`<label>${label}<input name="${name}" type="${type}" required ${extra}></label>`;
const select=(name,label,items)=>`<label>${label}<select name="${name}" aria-label="${label}" required>${options(items)}</select></label>`;
const table=(headers,rows,empty)=>`<div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>${rows.length?'':`<p class="empty">${empty}</p>`}</div>`;
function notice(msg){$('#notice').textContent=msg;clearTimeout(notice.timer);notice.timer=setTimeout(()=>$('#notice').textContent='',6000);}
async function refresh(){if(window.vivaioDemo){state=window.vivaioDemo.get();render();return;}const r=await fetch('/api/state');if(!r.ok)throw Error('Impossibile caricare i dati.');state=await r.json();render();}
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 const pending=state.fees.filter(f=>!f.paid), sum=pending.reduce((s,f)=>s+f.amount,0);
 let html='';
 if(page==='overview'){
 const next=[...state.sessions].filter(s=>s.date>=new Date().toISOString().slice(0,10)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);
 html=`<h1>Ogni talento, una nuova possibilità.</h1><p class="sub">Benvenuto in Vivaio360. Ecco come sta crescendo la tua scuola calcio.</p><div class="stats">${[['Atleti iscritti',state.athletes.length],['Squadre attive',state.teams.length],['Allenamenti programmati',state.sessions.length],['Quote da incassare',euro(sum)]].map(([a,b])=>`<div class="stat"><label>${a}</label><strong>${b}</strong></div>`).join('')}</div><div class="hero"><h2>Più tempo sul campo.<br>Tutto il vivaio in un unico posto.</h2><p>Organizza le squadre, segui le presenze e tieni sotto controllo le quote.</p></div><div class="grid"><section class="panel"><h2>Prossimi allenamenti</h2>${next.map(s=>`<div class="row"><span>${esc(team(s.team_id))}<small>${day(s.date)} · ${esc(s.place)}</small></span><button data-open="${s.id}">Presenze</button></div>`).join('')||'<p class="empty">Programma il primo allenamento nella sezione Allenamenti.</p>'}</section><section class="panel"><h2>Quote da seguire</h2>${pending.slice(0,4).map(f=>`<div class="row"><span>${esc(athlete(f.athlete_id))}<small>${esc(f.description)} · scadenza ${day(f.due)}</small></span><span class="pill unpaid">${euro(f.amount)}</span></div>`).join('')||'<p class="empty">Nessuna quota in sospeso.</p>'}</section></div>`;
 }
 if(page==='teams') html=`<h1>Le tue squadre</h1><p class="sub">Un gruppo, una passione. Organizza categorie e atleti.</p><section class="panel"><h2>Nuova squadra</h2><form data-api="teams">${field('name','Nome squadra')}${field('category','Categoria','text','placeholder="Es. Pulcini"')}<button>Crea squadra</button></form></section><section class="panel">${table(['Squadra','Categoria','Atleti'],state.teams.map(t=>`<tr><td><strong>${esc(t.name)}</strong></td><td>${esc(t.category)}</td><td>${state.athletes.filter(a=>a.team_id===t.id).length}</td></tr>`),'Crea la prima squadra per iniziare.')}</section>`;
 if(page==='athletes')html=`<h1>Atleti e genitori</h1><p class="sub">Le persone al centro del tuo vivaio.</p><section class="panel"><h2>Nuovo atleta</h2>${state.teams.length?`<form data-api="athletes">${field('name','Nome e cognome')}${field('birth','Data di nascita','date')}${select('team_id','Squadra',state.teams)}${field('parent','Genitore / tutore')}${field('phone','Telefono del genitore','tel')}<button>Salva atleta</button></form>`:'<p class="empty">Crea prima una squadra nella sezione Squadre.</p>'}</section><section class="panel">${table(['Atleta','Squadra','Genitore / tutore','Contatto'],state.athletes.map(a=>`<tr><td><strong>${esc(a.name)}</strong><small>${day(a.birth)}</small></td><td>${esc(team(a.team_id))}</td><td>${esc(a.parent)}</td><td>${esc(a.phone)}</td></tr>`),'Non ci sono ancora atleti iscritti.')}</section>`;
 if(page==='sessions'){
 const session=state.sessions.find(s=>String(s.id)===selectedSession);
 html=`<h1>Allenamenti e presenze</h1><p class="sub">Pianifica il campo, segui ogni partecipazione.</p><section class="panel"><h2>Programma allenamento</h2>${state.teams.length?`<form data-api="sessions">${select('team_id','Squadra',state.teams)}${field('date','Data','date')}${field('place','Campo / luogo')}<button>Programma</button></form>`:'<p class="empty">Crea prima una squadra.</p>'}</section><section class="panel"><h2>Registro presenze</h2><label>Allenamento<select id="session-picker"><option value="">Seleziona un allenamento…</option>${[...state.sessions].sort((a,b)=>b.date.localeCompare(a.date)).map(s=>`<option value="${s.id}" ${String(s.id)===selectedSession?'selected':''}>${day(s.date)} · ${esc(team(s.team_id))} · ${esc(s.place)}</option>`).join('')}</select></label>${session?state.athletes.filter(a=>a.team_id===session.team_id).map(a=>{const record=state.attendance.find(x=>x.session_id===session.id&&x.athlete_id===a.id);return `<div class="row"><span>${esc(a.name)}<small>${record?record.present?'Presente':'Assente':'Da registrare'}</small></span><div class="actions"><button data-attendee="${a.id}" data-present="1" class="${record?.present===1?'selected':''}">Presente</button><button data-attendee="${a.id}" data-present="0" class="${record?.present===0?'selected':''}">Assente</button></div></div>`;}).join('')||'<p class="empty">Nessun atleta in questa squadra.</p>':'<p class="empty">Seleziona un allenamento per registrare le presenze.</p>'}</section>`;
 }
 if(page==='fees')html=`<h1>Quote e pagamenti</h1><p class="sub">Da incassare: <strong>${euro(sum)}</strong> · ${pending.length} quote in sospeso</p><section class="panel"><h2>Nuova quota</h2>${state.athletes.length?`<form data-api="fees">${select('athlete_id','Atleta',state.athletes)}${field('description','Descrizione','text','placeholder="Es. Iscrizione annuale"')}${field('amount','Importo (€)','number','min="0.01" max="100000" step="0.01"')}${field('due','Scadenza','date')}<button>Aggiungi quota</button></form>`:'<p class="empty">Registra prima un atleta.</p>'}</section><section class="panel">${table(['Atleta / quota','Scadenza','Importo','Stato','Azione'],state.fees.map(f=>`<tr><td><strong>${esc(athlete(f.athlete_id))}</strong><small>${esc(f.description)}</small></td><td>${day(f.due)}</td><td>${euro(f.amount)}</td><td><span class="pill ${f.paid?'':'unpaid'}">${f.paid?'Pagata':'Da pagare'}</span></td><td><button data-fee="${f.id}" data-paid="${f.paid?0:1}">${f.paid?'Annulla pagamento':'Segna pagata'}</button></td></tr>`),'Nessuna quota registrata.')}</section>`;
 $('#content').innerHTML=html;
}
async function post(path,body){if(window.vivaioDemo){window.vivaioDemo.post(path,body);await refresh();notice('Demo aggiornata solo in questo browser.');return;}const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const result=await r.json();if(!r.ok)throw Error(result.error);await refresh();notice('Salvato correttamente.');}
document.addEventListener('submit',async e=>{if(!e.target.matches('form[data-api]'))return;e.preventDefault();const form=e.target,button=form.querySelector('button');button.disabled=true;const b=Object.fromEntries(new FormData(form));for(const key of ['team_id','athlete_id'])if(key in b)b[key]=Number(b[key]);if(form.dataset.api==='fees')b.amount=Math.round(Number(b.amount)*100);try{await post(form.dataset.api,b);}catch(err){notice(err.message);button.disabled=false;}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='reset-demo'){window.vivaioDemo.reset();selectedSession='';await refresh();notice('Dati dimostrativi ripristinati.');return;}if(b.dataset.page){page=b.dataset.page;render();}if(b.dataset.open){page='sessions';selectedSession=b.dataset.open;render();}try{if(b.dataset.attendee)await post('attendance',{session_id:Number(selectedSession),athlete_id:Number(b.dataset.attendee),present:Number(b.dataset.present)});if(b.dataset.fee)await post('payments',{id:Number(b.dataset.fee),paid:Number(b.dataset.paid)});}catch(err){notice(err.message);}});
document.addEventListener('change',e=>{if(e.target.id==='session-picker'){selectedSession=e.target.value;render();}});
refresh().catch(e=>notice(e.message));
</script></body></html>
